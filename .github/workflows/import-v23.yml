name: Import v2.3 package

on:
  push:
    paths:
      - '.upload/READY'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and unpack v2.3
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/part-* > /tmp/ai-werewolf-v2.3.zip.b64
          base64 -d /tmp/ai-werewolf-v2.3.zip.b64 > /tmp/ai-werewolf-v2.3.zip
          rm -rf /tmp/ai-werewolf-v2.3
          mkdir -p /tmp/ai-werewolf-v2.3
          unzip -q /tmp/ai-werewolf-v2.3.zip -d /tmp/ai-werewolf-v2.3
          rsync -a /tmp/ai-werewolf-v2.3/ai-werewolf/ ./
          rm -rf .upload
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import AI Werewolf v2.3 source"
          git push
