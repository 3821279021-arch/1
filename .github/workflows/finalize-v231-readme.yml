name: Finalize v2.3.1 README
on:
  push:
    paths:
      - '.github/workflows/finalize-v231-readme.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore v2.3.1 README
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > README.md
          test "$(git hash-object README.md)" = "c68fb0d9732a2a6db357e48d3f062477860da838"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm .github/workflows/finalize-v231-readme.yml
          git commit -m "Update README for v2.3.1"
          git push
