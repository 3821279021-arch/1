name: Import V3.1 delivery
on:
  push:
    branches: [main]
    paths:
      - '.v31-import/**'
      - '.github/workflows/import-v31.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify delivery
        shell: bash
        run: |
          set -euo pipefail
          cat .v31-import/part_* > /tmp/v31.zip
          echo "c2d4791d5f968ff5e3bf6e5c3a93ae2c917a782a32a6dc953a978cc2e0212174  /tmp/v31.zip" | sha256sum -c -
          rm -rf /tmp/v31
          mkdir -p /tmp/v31
          unzip -q /tmp/v31.zip -d /tmp/v31
          test "$(cat /tmp/v31/ai-werewolf/VERSION)" = "3.1.0"
          rsync -a --delete --exclude='.git/' /tmp/v31/ai-werewolf/ ./
      - name: Commit V3.1 replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Replace project with AI Werewolf V3.1.0"
          git push origin HEAD:main
