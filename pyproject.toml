[project]
name = "ai-werewolf"
version = "3.3.0"
description = "Multiplayer AI social deduction and reproducible arena"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/benchmark_memory.py" = ["E402"] # Imports follow extraction of an external baseline archive.

[tool.mypy]
python_version = "3.12"
files = ["app/rng.py", "app/game.py", "app/rules.py", "app/persistence.py", "app/providers.py", "app/model_registry.py", "app/trace.py", "app/versions.py", "tools/arena"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = false

[tool.coverage.run]
source = ["app", "tools/arena"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.xml]
output = "test-artifacts/coverage.xml"

[tool.coverage.html]
directory = "test-artifacts/coverage"
